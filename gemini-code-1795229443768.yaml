name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Project Dependencies
      run: npm install

    - name: Add Capacitor Android Platform
      run: npx cap add android

    - name: Inject Camera Permissions into AndroidManifest
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="true" />\n    <uses-feature android:name="android.hardware.camera.autofocus" />' "$MANIFEST_PATH"
          echo "Successfully injected camera permissions."
        else
          echo "AndroidManifest.xml not found!"
          exit 1
        fi

    - name: Sync Capacitor Web Assets to Android
      run: npx cap sync android

    - name: Build Debug APK with Gradle
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: utensil-ai-scanner-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk